aid: doorstead
name: Doorstead
description: 'Doorstead is a technology-enabled residential property management and tenant
  placement company headquartered in San Francisco, serving single-family and small
  multifamily rental owners across California, Washington, Florida, Texas, North Carolina,
  South Carolina, Ohio, Virginia and Massachusetts. It sells two productized services:
  Doorstead Place, a tenant-placement-only offering covering rental pricing guidance,
  listing syndication, professional photography, agent-led tours, tenant screening and
  digital lease signing; and Doorstead Manage, full-service property management that
  adds rent collection and distribution, security-deposit holding, income and expense
  tracking, annual 1099s, 24/7 maintenance coordination, move-in/move-out evaluations,
  lease renewals and turnovers. The company markets a data-driven rental pricing model
  and an owner and tenant portal, but publishes no public developer API, SDK, webhook
  surface or developer portal; its production GraphQL endpoint at api.doorstead.com
  serves its own first-party applications and rejects anonymous requests. Doorstead
  discontinued its legacy Rent Guarantee product in early 2025.'
